name: Markdown
on:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@5a3d29e21df96b1745f372289dc7c925fd248df2 # v2.1.0
      - name: markdownlint
        run: docker run --rm -i -v ${PWD}:/work tmknom/markdownlint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@5a3d29e21df96b1745f372289dc7c925fd248df2 # v2.1.0
      - name: Prettier
        run: docker run --rm -v ${PWD}:/work tmknom/prettier --list-different --parser=markdown '**/*.md'
